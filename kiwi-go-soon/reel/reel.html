<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Kiwi Go Reel</title>
<style>
@font-face{font-family:'ID';src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf') format('opentype');font-weight:900}
@font-face{font-family:'IX';src:url('file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf') format('opentype');font-weight:800}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111410}
svg{display:block}
text{font-kerning:normal}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
  <g id="measure" opacity="0"></g>
</svg>
<script>
// Kiwi Go — "coming soon" reel. Deterministic: render(t) draws the frame at time t (seconds).
const C = { lime:'#B8F03C', ink:'#111410', paper:'#FFFDF7', cream:'#F6F1E4', sand:'#ECE6D6',
            peel:'#7A5A3C', green:'#3F6212', rim:'#6BA82B' };
const W = 1080, H = 1920, CX = 530, DUR = 9.6;

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = u => 1 - Math.pow(1 - u, 3);
const eInC = u => u * u * u;
const eInQ = u => u * u;
const eOutQ = u => 1 - (1 - u) * (1 - u);
const eInOutC = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOutBack = (u, s = 1.70158) => { const c = s + 1; return 1 + c * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const eOutExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const damped = (tau, f = 3, d = 7) => tau < 0 ? 0 : Math.exp(-d * tau) * Math.cos(2 * Math.PI * f * tau);
const shake = (t, t0, amp, f = 13) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * 12) * Math.sin((t - t0) * f * 2 * Math.PI);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f2 = n => (+n).toFixed(2);

// ---------- logo (exactly as given) ----------
(function defs() {
  let seeds = '';
  for (let i = 0; i < 16; i++) seeds += `<ellipse cx="0" cy="${i % 2 === 0 ? -40 : -52}" rx="5.5" ry="11" transform="rotate(${i * 22.5})"/>`;
  let seedsS = '';
  for (let i = 0; i < 8; i++) seedsS += `<ellipse cx="0" cy="-48" rx="7" ry="14" transform="rotate(${i * 45})"/>`;
  document.getElementById('defs').innerHTML =
    `<g id="logo"><circle r="100" fill="${C.ink}"/><circle r="80" fill="${C.rim}"/><circle r="73" fill="${C.lime}"/>` +
    `<g fill="${C.ink}">${seeds}</g><circle r="20" fill="${C.cream}"/><circle r="7" fill="${C.ink}"/></g>` +
    `<g id="logoS"><circle r="100" fill="${C.ink}"/><circle r="78" fill="${C.lime}"/><g fill="${C.ink}">${seedsS}</g>` +
    `<circle r="24" fill="${C.cream}"/><circle r="8" fill="${C.ink}"/></g>`;
})();
// wheel whose contact point sits on groundY; squash (sx, sy) is anchored at the contact point
function wheel(x, groundY, r, angDeg, sx = 1, sy = 1, id = 'logo') {
  return `<g transform="translate(${f2(x)},${f2(groundY)}) scale(${f2(sx)},${f2(sy)}) translate(0,${f2(-r)}) rotate(${f2(angDeg)}) scale(${r / 100})"><use href="#${id}"/></g>`;
}

// ---------- text ----------
function measure(str, font, size, ls) {
  const m = document.getElementById('measure');
  m.innerHTML = `<text font-family="${font}" font-size="${size}" style="letter-spacing:${ls * size}px">${str}</text>`;
  return m.firstChild.getComputedTextLength();
}
function fit(strs, font, maxW, cap, ls = -0.035) {
  let s = cap;
  for (const str of strs) s = Math.min(s, cap * maxW / measure(str, font, cap, ls));
  return Math.floor(s);
}
function text(str, x, y, size, fill, font = 'ID', ls = -0.035, extra = '') {
  return `<text x="${f2(x)}" y="${f2(y)}" font-family="${font}" font-size="${f2(size)}" fill="${fill}" text-anchor="middle" style="letter-spacing:${f2(ls * size)}px" ${extra}>${str}</text>`;
}
// pop-in: scale about the visual centre of a text line
function popText(t, t0, str, x, y, size, fill, opts = {}) {
  if (t < t0) return '';
  const { font = 'ID', dur = .24, from = 1.6, rot = 0, out = null, ls = -0.035, back = 2.2 } = opts;
  const u = prog(t, t0, t0 + dur);
  let s = lerp(from, 1, eOutBack(u, back));
  let op = clamp((t - t0) / 0.05);
  let dy = 0;
  if (out) { const v = prog(t, out[0], out[1]); if (v >= 1) return ''; op *= 1 - eInQ(v); dy = -60 * eInC(v); s *= 1 - .15 * eInC(v); }
  const cy = y - size * 0.36;
  return `<g opacity="${f2(op)}" transform="translate(${f2(x)},${f2(cy + dy)}) rotate(${f2(rot * (1 - eOutC(u)))}) scale(${s.toFixed(4)}) translate(${f2(-x)},${f2(-cy)})">${text(str, x, y, size, fill, font, ls)}</g>`;
}

// ---------- scenery ----------
const FAR = [[0, 960], [150, 820], [270, 900], [430, 740], [580, 880], [720, 790], [850, 900], [1000, 760], [1110, 880], [1200, 960]];
const MID = [[0, 1080], [170, 930], [300, 1030], [470, 870], [640, 1020], [780, 920], [930, 1050], [1100, 1080]];
function ridge(pts, tileW, off, base, fill) {
  let out = '';
  const o0 = ((off % tileW) + tileW) % tileW;
  for (let k = -1; k < 3; k++) {
    const ox = -o0 + k * tileW;
    if (ox > W || ox + tileW < 0) continue;
    const p = pts.map(([x, y]) => `${f2(x + ox)},${y}`).join(' ');
    out += `<polygon points="${f2(ox)},${base} ${p} ${f2(ox + tileW)},${base}" fill="${fill}"/>`;
  }
  return out;
}
function snow(pts, tileW, off, fill) {
  let out = '';
  const o0 = ((off % tileW) + tileW) % tileW;
  for (let k = -1; k < 3; k++) {
    const ox = -o0 + k * tileW;
    if (ox > W || ox + tileW < 0) continue;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i], [ax, ay] = pts[i - 1], [bx, by] = pts[i + 1];
      if (py > ay || py > by) continue; // only peaks
      const f = 0.32;
      const L = [lerp(px, ax, f), lerp(py, ay, f)], R = [lerp(px, bx, f), lerp(py, by, f)];
      const m1 = [lerp(R[0], L[0], .3), lerp(R[1], L[1], .3) - 16], m2 = [lerp(R[0], L[0], .55), lerp(R[1], L[1], .55) + 10], m3 = [lerp(R[0], L[0], .8), lerp(R[1], L[1], .8) - 12];
      const pp = [[px, py], R, m1, m2, m3, L].map(([x, y]) => `${f2(x + ox)},${f2(y)}`).join(' ');
      out += `<polygon points="${pp}" fill="${fill}"/>`;
    }
  }
  return out;
}
function parcel(x, bottomY, rot) {
  const w = 196, h = 150;
  return `<g transform="translate(${f2(x)},${f2(bottomY)}) rotate(${f2(rot)})">
    <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" rx="10" fill="${C.sand}" stroke="${C.ink}" stroke-width="9"/>
    <rect x="-20" y="${-h}" width="40" height="${h}" fill="${C.peel}"/>
    <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" rx="10" fill="none" stroke="${C.ink}" stroke-width="9"/>
    <g transform="translate(-62,${-h / 2 + 8}) scale(0.27)"><use href="#logoS"/></g>
    <path d="M 40 ${-h + 40} l 22 -16 l 22 16 M 62 ${-h + 24} v 40" stroke="${C.ink}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>`;
}
function speedLines(t, x, cy, spread, color, t0, t1, seed, n = 6, maxLen = 260) {
  let out = '';
  const a = prog(t, t0, t0 + .15) * (1 - prog(t, t1 - .15, t1));
  if (a <= 0) return '';
  for (let i = 0; i < n; i++) {
    const r1 = rnd(seed + i), r2 = rnd(seed + i + 50);
    const y = cy + (r1 - .5) * spread;
    const len = maxLen * (0.45 + .55 * r2) * a;
    const phase = ((t * 3.2 + r2) % 1);
    const xx = x - 30 - phase * 120 - len;
    const hgt = i % 3 === 0 ? 16 : 9;
    out += `<rect x="${f2(xx)}" y="${f2(y - hgt / 2)}" width="${f2(len)}" height="${hgt}" rx="${hgt / 2}" fill="${color}" opacity="${f2(a)}"/>`;
  }
  return out;
}
function seedBurst(t, t0, x, y, color, seed, n = 12, dist = 520) {
  const u = prog(t, t0, t0 + .55);
  if (t < t0 || u >= 1) return '';
  let out = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * 360 + rnd(seed + i) * 18;
    const d = 120 + dist * eOutExpo(u) * (0.7 + .3 * rnd(seed + i + 9));
    const sc = 1 - eInQ(u);
    out += `<g transform="rotate(${f2(ang)} ${x} ${y}) translate(${x} ${f2(y - d)}) scale(${f2(sc)})"><ellipse rx="11" ry="24" fill="${color}"/></g>`;
  }
  return out;
}

// ---------- layout constants (computed once fonts are ready) ----------
let L = {};
function layout() {
  L.a1 = fit(['Это не', 'просто киви.'], 'ID', 840, 150);
  L.a2top = 132;
  L.a2 = fit(['колесо!'], 'ID', 700, 220);
  L.a2w = measure('колесо!', 'ID', L.a2, -0.035);
  L.b1 = fit(['Курьерская', 'служба'], 'ID', 840, 150);
  L.b2 = fit(['Платите', 'только за', 'доставку'], 'ID', 820, 128);
  L.c = fit(['Скоро', 'запуск'], 'ID', 840, 290);
  L.wm = fit(['Kiwi Go'], 'ID', 760, 190, -0.04);
  L.tag = fit(['Доставка по всему', 'Кыргызстану'], 'IX', 820, 70, -0.02);
  L.pill = 58;
  L.pillW = measure('Скоро запуск', 'IX', L.pill, -0.02) + 96;
}

// ---------- scenes ----------
function sceneA(t) { // 0 – 2.05: lime. "Это не просто киви." → "Это колесо!" → spin-up → launch
  const G = 1300, R = 230;
  let o = `<rect width="${W}" height="${H}" fill="${C.lime}"/>`;
  // ground line grows from impact point
  const gl = eOutExpo(prog(t, .2, .55));
  o += `<rect x="${f2(540 - 400 * gl)}" y="${G}" width="${f2(800 * gl)}" height="12" rx="6" fill="${C.ink}"/>`;
  // wheel motion
  let x = 540, cyTop, sx = 1, sy = 1, ang = 0;
  const land = .22;
  if (t < land) {
    const u = t / land;
    const cy = lerp(240, G - R, eInQ(u));
    cyTop = cy + R; sx = 1 - .1 * u; sy = 1 + .14 * u; ang = -25 * (1 - u);
  } else {
    cyTop = G;
    const s = damped(t - land, 3.2, 7.5);
    sy = 1 - .24 * s; sx = 1 + .2 * s;
    if (t > .6 && t < 1.3) ang = -7 * Math.sin(2 * Math.PI * 1.45 * (t - .6)) * prog(t, .6, .8);
  }
  // spin-up 1.30–1.88, launch 1.88+
  const ts = 1.3, tl = 1.88, wmax = 1900;
  if (t >= ts) {
    const tau = Math.min(t, tl) - ts, D = tl - ts;
    ang = wmax * Math.pow(tau, 3) / (3 * D * D);
    if (t > tl) ang += wmax * (t - tl);
    x = 540 - 70 * eOutC(prog(t, ts, ts + .35));
    sy *= 1 - .06 * eOutC(prog(t, ts, ts + .35)); sx *= 1 + .04 * eOutC(prog(t, ts, ts + .35));
    // jitter while burning rubber
    if (t < tl) x += Math.sin(t * 190) * 4 * prog(t, 1.5, tl);
  }
  if (t >= tl) {
    const u = prog(t, tl, tl + .2);
    x = lerp(470, 1700, eInC(u));
    sx = 1 + .18 * Math.min(1, u * 3); sy = 1 - .1 * Math.min(1, u * 3);
  }
  // burn-out smoke (paper puffs behind the wheel)
  let smoke = '';
  for (let i = 0; i < 12; i++) {
    const t0 = 1.34 + i * .05, age = t - t0, life = .65;
    if (age < 0 || age > life) continue;
    const a = age / life;
    const px = 470 - 60 - age * (380 + 260 * rnd(i)) , py = G - 26 - age * (120 + 240 * rnd(i + 3));
    smoke += `<circle cx="${f2(px)}" cy="${f2(py)}" r="${f2(26 + 130 * eOutC(a))}" fill="${C.paper}" opacity="${f2(.95 * (1 - a))}"/>`;
  }
  // impact dust
  let dust = '';
  for (let i = 0; i < 8; i++) {
    const age = t - land, life = .45;
    if (age < 0 || age > life) continue;
    const a = age / life, dir = i % 2 ? 1 : -1;
    const px = 540 + dir * (150 + 330 * eOutC(a) * (0.6 + .4 * rnd(i)));
    const py = G - 14 - 120 * Math.sin(Math.PI * a) * rnd(i + 7);
    dust += `<circle cx="${f2(px)}" cy="${f2(py)}" r="${f2(18 * (1 - a) + 6)}" fill="${C.ink}" opacity="${f2(1 - a)}"/>`;
  }
  o += smoke + dust;
  o += speedLines(t, x - R + 10, G - R, 360, C.ink, 1.55, 2.1, 11, 7, 320);
  o += wheel(x, cyTop, R, ang, sx, sy);
  // copy
  o += popText(t, .22, 'Это не', CX, 450, L.a1, C.ink, { out: [1.24, 1.32], rot: -6 });
  o += popText(t, .32, 'просто киви.', CX, 450 + L.a1 * 1.05, L.a1, C.ink, { out: [1.24, 1.32], rot: 5 });
  if (t >= 1.3) {
    o += popText(t, 1.3, 'Это', CX, 410, L.a2top, C.ink, { from: 2 });
    // ink pill with lime word
    const u = prog(t, 1.38, 1.62), s = eOutBack(u, 2.6);
    const pw = L.a2w + 110, ph = L.a2 * 1.12, py = 470;
    if (t >= 1.38) o += `<g transform="translate(${CX},${py + ph / 2}) rotate(${f2(-4 + 6 * (1 - u))}) scale(${f2(s)}) translate(${-CX},${-(py + ph / 2)})">
      <rect x="${f2(CX - pw / 2)}" y="${py}" width="${f2(pw)}" height="${f2(ph)}" rx="${f2(ph / 2)}" fill="${C.ink}"/>
      ${text('колесо!', CX, py + ph / 2 + L.a2 * .36, L.a2, C.lime)}</g>`;
  }
  return o;
}

function sceneB(t) { // 1.9 – 5.4: road through the mountains with a parcel
  const G = 1240, R = 150, v = 760;
  const s = v * Math.max(0, t - 1.9);
  let o = `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
  // lime sun
  o += `<circle cx="${f2(800 - s * .02)}" cy="820" r="125" fill="${C.lime}"/>`;
  o += ridge(FAR, 1200, s * .12, G, C.sand);
  o += ridge(MID, 1100, s * .3, G, C.green);
  o += snow(MID, 1100, s * .3, C.paper);
  // road
  o += `<rect x="0" y="${G}" width="${W}" height="240" fill="${C.ink}"/>`;
  o += `<rect x="0" y="${G + 240}" width="${W}" height="${H - G - 240}" fill="${C.sand}"/>`;
  const dash = 150, off = s % dash;
  for (let k = -1; k < 9; k++) o += `<rect x="${f2(k * dash - off)}" y="${G + 113}" width="84" height="14" rx="7" fill="${C.paper}"/>`;
  // wheel position
  let x = lerp(-260, 380, eOutBack(prog(t, 2.0, 2.4), 1.2));
  x = lerp(x, 540, eInOutC(prog(t, 4.35, 4.95)));
  const ang = (s + x) / R * 180 / Math.PI;
  // bounce on the beat (120 bpm → every 0.5 s, lands on the beat)
  const bt = Math.max(0, t - 2.0), ph = (bt % .5) / .5, beatIdx = Math.floor(bt / .5);
  const amp = t < 2.0 ? 0 : (t < 2.5 ? 30 : 58);
  const hop = amp * Math.sin(Math.PI * ph);
  const sq = t >= 2.5 ? damped(bt % .5, 4, 14) : 0;
  const wsy = 1 - .06 * sq, wsx = 1 + .04 * sq;
  o += speedLines(t, x - R + 20, G - R - 10, 300, C.ink, 2.05, 5.0, 31, 6, 240);
  if (t >= 2.0) o += wheel(x, G, R, ang, wsx, wsy);
  const prot = (beatIdx % 2 ? 1 : -1) * 7 * Math.sin(Math.PI * ph);
  if (t >= 2.0) o += parcel(x - 6, G - 2 * R * wsy + 6 - hop, prot);
  // copy
  o += popText(t, 2.0, 'Курьерская', CX, 440, L.b1, C.ink, { out: [3.38, 3.48], rot: -5 });
  o += popText(t, 2.25, 'служба', CX, 440 + L.b1 * 1.05, L.b1, C.ink, { out: [3.38, 3.48], rot: 5 });
  const b2y = 390, b2s = L.b2 * 1.04;
  o += popText(t, 3.5, 'Платите', CX, b2y, L.b2, C.ink, { out: [4.82, 4.92], rot: -5 });
  o += popText(t, 3.75, 'только за', CX, b2y + b2s, L.b2, C.ink, { out: [4.82, 4.92] });
  o += popText(t, 4.0, 'доставку', CX, b2y + 2 * b2s, L.b2, C.ink, { out: [4.82, 4.92], rot: 5 });
  // zoom into the hub 4.95 – 5.4 (camera transform)
  const zu = prog(t, 4.95, 5.4);
  if (zu > 0) {
    const Z = Math.exp(Math.log(110) * Math.pow(zu, 2.1));
    const fx = 540, fy = G - R; // wheel hub
    const tx = lerp(fx, 540, eOutC(zu)), ty = lerp(fy, 960, eOutC(zu));
    o = `<rect width="${W}" height="${H}" fill="${C.ink}"/><g transform="translate(${f2(tx)},${f2(ty)}) scale(${Z.toFixed(4)}) translate(${-fx},${-fy})">${o}</g>`;
  }
  return o;
}

function sceneC(t) { // 5.4 – 7.3: ink. "Скоро" / "запуск"
  let o = `<rect width="${W}" height="${H}" fill="${C.ink}"/>`;
  const sx = shake(t, 5.5, 14) + shake(t, 6.0, 18), sy = shake(t, 5.5, 10, 11) - shake(t, 6.0, 12, 11);
  const drift = 1 + .035 * prog(t, 6.2, 7.3);
  const y1 = 860, y2 = y1 + L.c * .98;
  o += seedBurst(t, 5.5, CX, y1 - L.c * .36, C.lime, 3, 12, 560);
  o += seedBurst(t, 6.0, CX, y2 - L.c * .36, C.lime, 40, 14, 600);
  o += `<g transform="translate(${f2(sx)},${f2(sy)}) translate(${CX},960) scale(${drift.toFixed(4)}) translate(${-CX},-960)">`;
  o += popText(t, 5.5, 'Скоро', CX, y1, L.c, C.paper, { from: 2.3, rot: -8, dur: .26 });
  o += popText(t, 6.0, 'запуск', CX, y2, L.c, C.lime, { from: 2.3, rot: 8, dur: .26 });
  o += '</g>';
  return o;
}

function sceneD(t) { // 7.0 – end: paper end card
  const LY = 660, R = 210, G = LY + R;
  let o = '';
  // iris from the centre
  const ir = 1700 * eOutC(prog(t, 7.0, 7.32));
  o += `<circle cx="540" cy="${LY}" r="${f2(ir)}" fill="${C.paper}"/>`;
    // road line laid ahead of the wheel
  const gl = eOutC(prog(t, 7.12, 7.55));
  o += `<rect x="${f2(240)}" y="${G + 2}" width="${f2(600 * gl)}" height="12" rx="6" fill="${C.ink}"/>`;
  // wheel rolls in and stops with overshoot
  const u = prog(t, 7.15, 7.95);
  const x = lerp(-320, 540, eOutBack(u, 1.6));
  const hop = t > 8.0 ? 34 * Math.sin(Math.PI * prog(t, 8.0, 8.32)) : 0;
  const land = damped(t - 8.32, 3.5, 10);
  const sq = t > 8.32 ? land : 0;
  const ang = (x - 540) / R * 180 / Math.PI;
  o += speedLines(t, x - R + 20, LY, 300, C.ink, 7.15, 8.05, 71, 6, 260);
  if (u > 0) o += wheel(x, G - hop, R, ang, 1 + .06 * sq, 1 - .08 * sq);
  // copy
  const wy = 1075;
  o += popText(t, 8.0, 'Kiwi Go', CX, wy, L.wm, C.ink, { from: .4, rot: -4, dur: .3, ls: -0.04, back: 2.4 });
  const tagY = wy + 110;
  for (const [i, str] of ['Доставка по всему', 'Кыргызстану'].entries()) {
    const t0 = 8.25 + i * .12, v = eOutC(prog(t, t0, t0 + .3));
    if (t < t0) continue;
    o += `<g opacity="${f2(clamp((t - t0) / .12))}" transform="translate(0,${f2(40 * (1 - v))})">${text(str, CX, tagY + i * L.tag * 1.18, L.tag, C.ink, 'IX', -0.02)}</g>`;
  }
  const pu = prog(t, 8.5, 8.78);
  if (t >= 8.5) {
    const py = tagY + L.tag * 1.18 + 70, ph = 104, s = eOutBack(pu, 2.4);
    o += `<g transform="translate(${CX},${py + ph / 2}) scale(${f2(s)}) translate(${-CX},${-(py + ph / 2)})">
      <rect x="${f2(CX - L.pillW / 2)}" y="${py}" width="${f2(L.pillW)}" height="${ph}" rx="${ph / 2}" fill="${C.ink}"/>
      ${text('Скоро запуск', CX, py + ph / 2 + L.pill * .36, L.pill, C.lime, 'IX', -0.02)}</g>`;
  }
  return o;
}

function render(t) {
  let o = '';
  if (t < 2.06) {
    const u = eInOutC(prog(t, 1.9, 2.06));
    o += `<g transform="translate(${f2(-1080 * u)},0)">${sceneA(t)}</g>`;
    if (u > 0) o += `<g transform="translate(${f2(1080 * (1 - u))},0)">${sceneB(t)}</g>`;
  } else if (t < 5.4) o += sceneB(t);
  else if (t < 7.0) o += sceneC(t);
  else {
    o += t < 7.33 ? sceneC(t) : '';
    o += sceneD(t);
  }
  // global fade from/to nothing is done in audio only; keep picture full-bleed
  document.getElementById('root').innerHTML = o;
}

window.READY = false;
Promise.all([document.fonts.load('900 100px ID'), document.fonts.load('800 100px IX')])
  .then(() => document.fonts.ready)
  .then(() => { layout(); render(0); window.READY = true; });
</script>
