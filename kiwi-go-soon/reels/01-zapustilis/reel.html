<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Kiwi Go Reel 01</title>
<style>
@font-face{font-family:'ID';src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf') format('opentype');font-weight:900}
@font-face{font-family:'IX';src:url('file:///home/user/kyz-uzatuu/kiwi-go-soon/fonts/Inter-ExtraBold.otf') format('opentype');font-weight:800}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111410}
svg{display:block}
text{font-kerning:normal}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
  <g id="measure" opacity="0"></g>
</svg>
<script>
// Kiwi Go — Reel 01 «Мы запустились!». Deterministic: render(t) draws the frame at time t (seconds).
const C = { lime:'#B8F03C', ink:'#111410', paper:'#FFFDF7', cream:'#F6F1E4', sand:'#ECE6D6',
            peel:'#7A5A3C', green:'#3F6212', rim:'#6BA82B' };
const W = 1080, H = 1920, CX = 530, DUR = 12.0;

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = u => 1 - Math.pow(1 - u, 3);
const eInC = u => u * u * u;
const eInQ = u => u * u;
const eOutQ = u => 1 - (1 - u) * (1 - u);
const eInOutC = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOutBack = (u, s = 1.70158) => { const c = s + 1; return 1 + c * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const eOutExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const damped = (tau, f = 3, d = 7) => tau < 0 ? 0 : Math.exp(-d * tau) * Math.cos(2 * Math.PI * f * tau);
const shake = (t, t0, amp, f = 13) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * 12) * Math.sin((t - t0) * f * 2 * Math.PI);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f2 = n => (+n).toFixed(2);

// ---------- logo (exactly as given) + stamp texture ----------
(function defs() {
  let seeds = '';
  for (let i = 0; i < 12; i++) seeds += `<ellipse cx="0" cy="-56.3" rx="5" ry="14" transform="rotate(${i * 30})"/>`;
  // distressed-ink mask for the rubber stamp (local coords, centred on 0,0)
  let specks = '';
  for (let i = 0; i < 260; i++) {
    const x = (rnd(i * 3 + 1) - .5) * 820, y = (rnd(i * 3 + 2) - .5) * 380, r = 1.2 + 4.8 * Math.pow(rnd(i * 3 + 3), 2.2);
    specks += `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" fill="#000"/>`;
  }
  for (let i = 0; i < 14; i++) {   // dry-brush streaks
    const x = (rnd(i + 900) - .5) * 760, y = (rnd(i + 950) - .5) * 300, l = 30 + 90 * rnd(i + 990);
    specks += `<rect x="${f2(x)}" y="${f2(y)}" width="${f2(l)}" height="${f2(2 + 3 * rnd(i + 999))}" rx="2" fill="#000" opacity=".8"/>`;
  }
  document.getElementById('defs').innerHTML =
    `<g id="logo"><circle r="100" fill="${C.ink}"/><circle r="86" fill="${C.rim}"/><circle r="80.5" fill="${C.lime}"/>` +
    `<g fill="${C.ink}">${seeds}</g><circle r="26" fill="${C.cream}"/><circle r="8.5" fill="${C.ink}"/></g>` +
    `<mask id="stampMask" maskUnits="userSpaceOnUse" x="-500" y="-300" width="1000" height="600">` +
    `<rect x="-500" y="-300" width="1000" height="600" fill="#fff"/>${specks}</mask>`;
})();
function wheel(x, groundY, r, angDeg, sx = 1, sy = 1) {
  return `<g transform="translate(${f2(x)},${f2(groundY)}) scale(${f2(sx)},${f2(sy)}) translate(0,${f2(-r)}) rotate(${f2(angDeg)}) scale(${(r / 100).toFixed(4)})"><use href="#logo"/></g>`;
}
function wheelC(x, cy, r, angDeg, s = 1) { // centred, uniform scale
  return `<g transform="translate(${f2(x)},${f2(cy)}) rotate(${f2(angDeg)}) scale(${(r * s / 100).toFixed(4)})"><use href="#logo"/></g>`;
}

// ---------- text ----------
function measure(str, font, size, ls) {
  const m = document.getElementById('measure');
  m.innerHTML = `<text font-family="${font}" font-size="${size}" style="letter-spacing:${ls * size}px">${str}</text>`;
  return m.firstChild.getComputedTextLength();
}
function fit(strs, font, maxW, cap, ls = -0.035) {
  let s = cap;
  for (const str of strs) s = Math.min(s, cap * maxW / measure(str, font, cap, ls));
  return Math.floor(s);
}
function text(str, x, y, size, fill, font = 'ID', ls = -0.035, extra = '') {
  return `<text x="${f2(x)}" y="${f2(y)}" font-family="${font}" font-size="${f2(size)}" fill="${fill}" text-anchor="middle" style="letter-spacing:${f2(ls * size)}px" ${extra}>${str}</text>`;
}
function popText(t, t0, str, x, y, size, fill, opts = {}) {
  if (t < t0) return '';
  const { font = 'ID', dur = .24, from = 1.6, rot = 0, out = null, ls = -0.035, back = 2.2 } = opts;
  const u = prog(t, t0, t0 + dur);
  let s = lerp(from, 1, eOutBack(u, back));
  let op = clamp((t - t0) / 0.05);
  let dy = 0;
  if (out) { const v = prog(t, out[0], out[1]); if (v >= 1) return ''; op *= 1 - eInQ(v); dy = -60 * eInC(v); s *= 1 - .15 * eInC(v); }
  const cy = y - size * 0.36;
  return `<g opacity="${f2(op)}" transform="translate(${f2(x)},${f2(cy + dy)}) rotate(${f2(rot * (1 - eOutC(u)))}) scale(${s.toFixed(4)}) translate(${f2(-x)},${f2(-cy)})">${text(str, x, y, size, fill, font, ls)}</g>`;
}

// ---------- props ----------
const FAR = [[0, 960], [150, 820], [270, 900], [430, 740], [580, 880], [720, 790], [850, 900], [1000, 760], [1110, 880], [1200, 960]];
const MID = [[0, 1080], [170, 930], [300, 1030], [470, 870], [640, 1020], [780, 920], [930, 1050], [1100, 1080]];
function ridge(pts, tileW, off, base, fill, dy = 0) {
  let out = '';
  const o0 = ((off % tileW) + tileW) % tileW;
  for (let k = -1; k < 3; k++) {
    const ox = -o0 + k * tileW;
    if (ox > W || ox + tileW < 0) continue;
    const p = pts.map(([x, y], i) => `${f2(x + ox + (i === pts.length - 1 ? 2 : 0))},${y + dy}`).join(' ');
    out += `<polygon points="${f2(ox)},${base} ${p} ${f2(ox + tileW + 2)},${base}" fill="${fill}"/>`;
  }
  return out;
}
function snow(pts, tileW, off, fill, dy = 0) {
  let out = '';
  const o0 = ((off % tileW) + tileW) % tileW;
  for (let k = -1; k < 3; k++) {
    const ox = -o0 + k * tileW;
    if (ox > W || ox + tileW < 0) continue;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i], [ax, ay] = pts[i - 1], [bx, by] = pts[i + 1];
      if (py > ay || py > by) continue;
      const f = 0.32;
      const L = [lerp(px, ax, f), lerp(py, ay, f)], R = [lerp(px, bx, f), lerp(py, by, f)];
      const m1 = [lerp(R[0], L[0], .3), lerp(R[1], L[1], .3) - 16], m2 = [lerp(R[0], L[0], .55), lerp(R[1], L[1], .55) + 10], m3 = [lerp(R[0], L[0], .8), lerp(R[1], L[1], .8) - 12];
      const pp = [[px, py], R, m1, m2, m3, L].map(([x, y]) => `${f2(x + ox)},${f2(y + dy)}`).join(' ');
      out += `<polygon points="${pp}" fill="${fill}"/>`;
    }
  }
  return out;
}
function parcel(x, bottomY, rot, sc = 1) {
  const w = 196, h = 150;
  return `<g transform="translate(${f2(x)},${f2(bottomY)}) rotate(${f2(rot)}) scale(${sc})">
    <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" rx="10" fill="${C.sand}"/>
    <rect x="-20" y="${-h}" width="40" height="${h}" fill="${C.peel}"/>
    <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" rx="10" fill="none" stroke="${C.ink}" stroke-width="9"/>
    <g transform="translate(-62,${-h / 2 + 8}) scale(0.27)"><use href="#logo"/></g>
    <path d="M 40 ${-h + 40} l 22 -16 l 22 16 M 62 ${-h + 24} v 40" stroke="${C.ink}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>`;
}
function speedLines(t, x, cy, spread, color, t0, t1, seed, n = 6, maxLen = 260) {
  let out = '';
  const a = prog(t, t0, t0 + .15) * (1 - prog(t, t1 - .15, t1));
  if (a <= 0) return '';
  for (let i = 0; i < n; i++) {
    const r1 = rnd(seed + i), r2 = rnd(seed + i + 50);
    const y = cy + (r1 - .5) * spread;
    const len = maxLen * (0.45 + .55 * r2) * a;
    const phase = ((t * 3.2 + r2) % 1);
    const xx = x - 30 - phase * 120 - len;
    const hgt = i % 3 === 0 ? 16 : 9;
    out += `<rect x="${f2(xx)}" y="${f2(y - hgt / 2)}" width="${f2(len)}" height="${hgt}" rx="${hgt / 2}" fill="${color}" opacity="${f2(a)}"/>`;
  }
  return out;
}
function seedBurst(t, t0, x, y, color, seed, n = 12, dist = 520, sz = 1) {
  const u = prog(t, t0, t0 + .55);
  if (t < t0 || u >= 1) return '';
  let out = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * 360 + rnd(seed + i) * 18;
    const d = 120 + dist * eOutExpo(u) * (0.7 + .3 * rnd(seed + i + 9));
    const sc = (1 - eInQ(u)) * sz;
    out += `<g transform="rotate(${f2(ang)} ${x} ${y}) translate(${x} ${f2(y - d)}) scale(${f2(sc)})"><ellipse rx="11" ry="24" fill="${color}"/></g>`;
  }
  return out;
}
function burstLines(t, t0, x, y, color, seed, n = 16, r0 = 260, r1 = 640) { // comic impact rays
  const u = prog(t, t0, t0 + .32);
  if (t < t0 || u >= 1) return '';
  let out = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * 2 * Math.PI + rnd(seed + i) * .2;
    const a = r0 + (r1 - r0) * eOutExpo(u) * .55, b = r0 + (r1 - r0) * eOutC(u) * (.8 + .2 * rnd(seed + i + 3));
    const c = Math.cos(ang), s = Math.sin(ang), w = (i % 2 ? 10 : 18) * (1 - u);
    out += `<line x1="${f2(x + c * a)}" y1="${f2(y + s * a)}" x2="${f2(x + c * b)}" y2="${f2(y + s * b)}" stroke="${color}" stroke-width="${f2(w)}" stroke-linecap="round"/>`;
  }
  return out;
}
const CONF = [C.lime, C.ink, C.rim, C.peel, C.green, C.paper];
// confetti cannon: pieces from (x0,y0), launched around angle ang (deg, 0 = up), with drag
function confetti(t, t0, x0, y0, ang, spread, seed, n, cols = CONF, speed = 2300) {
  if (t < t0) return '';
  const tau = t - t0, k = 2.6, g = 1100;
  let out = '';
  for (let i = 0; i < n; i++) {
    const r1 = rnd(seed + i), r2 = rnd(seed + i + 101), r3 = rnd(seed + i + 202);
    const a = (ang + (r1 - .5) * spread) * Math.PI / 180;
    const v = speed * (.55 + .45 * r2);
    const vx = Math.sin(a) * v, vy = -Math.cos(a) * v;
    const e = 1 - Math.exp(-k * tau);
    const x = x0 + vx / k * e + 40 * Math.sin(tau * (5 + 4 * r3) + i);
    const y = y0 + vy / k * e + g / k * (tau - e / k);
    if (y > H + 60) continue;
    const rot = r3 * 360 + tau * (300 + 500 * r1) * (i % 2 ? 1 : -1);
    const fl = Math.cos(tau * (9 + 8 * r2) + i);
    const w = 16 + 14 * r3, h = 26 + 16 * r1;
    const col = cols[i % cols.length];
    out += `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(rot)}) scale(${f2(fl)},1)"><rect x="${f2(-w / 2)}" y="${f2(-h / 2)}" width="${f2(w)}" height="${f2(h)}" rx="3" fill="${col}"/></g>`;
  }
  return out;
}
function confettiRain(t, t0, seed, n, cols) {
  let out = '';
  for (let i = 0; i < n; i++) {
    const st = t0 + rnd(seed + i) * 2.4, tau = t - st;
    if (tau < 0) continue;
    const vy = 260 + 200 * rnd(seed + i + 7);
    const y = -40 + vy * tau, x = 60 + 960 * rnd(seed + i + 13) + 50 * Math.sin(tau * 2.4 + i);
    if (y > H + 40) continue;
    const rot = tau * (120 + 200 * rnd(seed + i + 3)) * (i % 2 ? 1 : -1) + 360 * rnd(i);
    const fl = Math.cos(tau * (6 + 5 * rnd(seed + i + 5)) + i);
    const w = 16 + 12 * rnd(i + 40), h = 26 + 14 * rnd(i + 41);
    out += `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(rot)}) scale(${f2(fl)},1)"><rect x="${f2(-w / 2)}" y="${f2(-h / 2)}" width="${f2(w)}" height="${f2(h)}" rx="3" fill="${cols[i % cols.length]}"/></g>`;
  }
  return out;
}

// ---------- billboard geometry (hook) ----------
const BB = { x0: 150, x1: 910, y0: 470, y1: 1010, cx: 530, cy: 740 };
let SHARDS = [], CRACKS = [], LETTERS = [];
function buildBoard() {
  const { x0, x1, y0, y1, cx, cy } = BB;
  const n = 9, angs = [];
  for (let i = 0; i < n; i++) angs.push((i + .15 + .7 * rnd(i + 500)) / n * 2 * Math.PI);
  const hit = a => { // ray from centre to rect edge
    const dx = Math.cos(a), dy = Math.sin(a);
    let tm = 1e9;
    if (dx > 1e-6) tm = Math.min(tm, (x1 - cx) / dx); if (dx < -1e-6) tm = Math.min(tm, (x0 - cx) / dx);
    if (dy > 1e-6) tm = Math.min(tm, (y1 - cy) / dy); if (dy < -1e-6) tm = Math.min(tm, (y0 - cy) / dy);
    return [cx + dx * tm, cy + dy * tm];
  };
  CRACKS = angs.map((a, i) => {
    const B = hit(a), pts = [[cx, cy]];
    for (let k = 1; k < 5; k++) {
      const u = k / 5, j = (rnd(i * 10 + k + 600) - .5) * 70;
      pts.push([lerp(cx, B[0], u) - Math.sin(a) * j, lerp(cy, B[1], u) + Math.cos(a) * j]);
    }
    pts.push(B);
    return pts;
  });
  const corners = [[x1, y1], [x0, y1], [x0, y0], [x1, y0]].map(p => [p, (Math.atan2(p[1] - cy, p[0] - cx) + 2 * Math.PI) % (2 * Math.PI)]);
  SHARDS = angs.map((a, i) => {
    const b = i + 1 < n ? angs[i + 1] : angs[0] + 2 * Math.PI;
    const poly = CRACKS[i].slice();
    const cs = corners.map(([p, ca]) => [p, ca < a ? ca + 2 * Math.PI : ca]).filter(([p, ca]) => ca > a && ca < b).sort((p, q) => p[1] - q[1]);
    for (const [p] of cs) poly.push(p);
    poly.push(...CRACKS[(i + 1) % n].slice().reverse());
    const mid = (a + b) / 2;
    let mx = 0, my = 0; poly.forEach(p => { mx += p[0]; my += p[1]; }); mx /= poly.length; my /= poly.length;
    return { poly, dir: mid, mx, my };
  });
  // letters of «Скоро» / «запуск» — each its own glyph so they can scatter
  LETTERS = [];
  const lines = [['Скоро', 0], ['запуск', 1]];
  L.bb = fit(['Скоро', 'запуск'], 'ID', 620, 220);
  const base1 = cy - 20, base2 = base1 + L.bb * 0.98;
  for (const [str, li] of lines) {
    const total = measure(str, 'ID', L.bb, -0.03);
    for (let k = 0; k < str.length; k++) {
      const pre = k ? measure(str.slice(0, k), 'ID', L.bb, -0.03) : 0;
      const wk = measure(str[k], 'ID', L.bb, -0.03);
      LETTERS.push({ ch: str[k], x: CX - total / 2 + pre + wk / 2, y: li ? base2 : base1, idx: LETTERS.length });
    }
  }
}

// ---------- layout ----------
let L = {};
function layout() {
  L.k1 = fit(['Kiwi Go'], 'ID', 700, 190, -0.04);
  L.k2 = fit(['запустился!'], 'ID', 780, 160);
  L.st = fit(['ДОСТАВЛЯЕМ'], 'ID', 680, 140, 0.01);
  L.c = fit(['Доставка', 'по всему', 'Кыргызстану'], 'ID', 790, 170);
  L.ot = 140;
  L.p = fit(['350'], 'ID', 720, 420, -0.045);
  L.som = 140; L.somW = measure('сом', 'ID', L.som, -0.03);
  L.wm = fit(['Kiwi Go'], 'ID', 720, 200, -0.04);
  L.pill = 62;
  L.pillW = measure('Заказать: kiwigo.kg', 'IX', L.pill, -0.02) + 100;
  buildBoard();
}

// ======================= SCENE A: hook (0 – 1.72) =======================
const TB = 0.70, TS = 1.00; // burst, stamp impact
function sceneA(t, drawWheel = true) {
  let o = `<rect width="${W}" height="${H}" fill="${C.lime}"/>`;
  // global shake on burst and stamp
  const gx = shake(t, TB, 22) + shake(t, TS, 26, 11), gy = shake(t, TB, 16, 11) + shake(t, TS, 30, 9);
  o += `<g transform="translate(${f2(gx)},${f2(gy)})">`;
  // tension shake of the billboard before the burst
  const ten = eInQ(prog(t, .2, TB));
  const bx = Math.sin(t * 97) * 11 * ten + Math.sin(t * 61) * 4 * ten, by = Math.cos(t * 83) * 6 * ten;
  const settle = t < .25 ? 1 + .05 * damped(t, 3, 9) : 1;
  const bulge = 1 + .035 * eInC(prog(t, .45, TB));
  if (t < TB) {
    o += `<g transform="translate(${f2(bx)},${f2(by)}) translate(${BB.cx},${BB.cy}) scale(${f2(settle * bulge)}) rotate(-2) translate(${-BB.cx},${-BB.cy})">`;
    // posts
    o += `<rect x="262" y="${BB.y1 - 10}" width="40" height="1000" fill="${C.ink}"/><rect x="758" y="${BB.y1 - 10}" width="40" height="1000" fill="${C.ink}"/>`;
    // board
    o += `<rect x="${BB.x0}" y="${BB.y0}" width="${BB.x1 - BB.x0}" height="${BB.y1 - BB.y0}" rx="22" fill="${C.paper}" stroke="${C.ink}" stroke-width="16"/>`;
    for (const [px, py] of [[188, 508], [872, 508], [188, 972], [872, 972]]) o += `<circle cx="${px}" cy="${py}" r="9" fill="${C.ink}"/>`;
    for (const Lt of LETTERS) o += text(Lt.ch, Lt.x, Lt.y, L.bb, C.ink, 'ID', 0);
    // cracks grow 0.42 – 0.70
    const cu = eInQ(prog(t, .42, TB));
    if (cu > 0) {
      for (const cr of CRACKS) {
        const m = Math.max(2, Math.ceil(cu * (cr.length - 1)) + 1);
        const pts = cr.slice(0, m).map(p => `${f2(p[0])},${f2(p[1])}`).join(' ');
        o += `<polyline points="${pts}" fill="none" stroke="${C.ink}" stroke-width="${f2(4 + 5 * cu)}" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      o += `<circle cx="${BB.cx}" cy="${BB.cy}" r="${f2(30 * cu)}" fill="${C.ink}"/>`;
    }
    o += '</g>';
  } else {
    const tau = t - TB;
    // posts fall away
    const pd = 1800 * tau * tau;
    o += `<g transform="translate(0,${f2(pd)})"><rect x="262" y="${BB.y1}" width="40" height="1000" fill="${C.ink}" transform="rotate(${f2(-20 * tau)} 282 ${BB.y1})"/><rect x="758" y="${BB.y1}" width="40" height="1000" fill="${C.ink}" transform="rotate(${f2(24 * tau)} 778 ${BB.y1})"/></g>`;
    // comic rays + seed burst behind
    o += burstLines(t, TB, BB.cx, 660, C.ink, 70, 18, 250, 700);
    o += seedBurst(t, TB + .02, BB.cx, 660, C.ink, 90, 14, 620, 1.2);
    // shards fly out
    for (const [i, s] of SHARDS.entries()) {
      const v = 1300 + 700 * rnd(i + 700), g = 3400;
      const dx = Math.cos(s.dir) * v * tau, dy = Math.sin(s.dir) * v * tau - 700 * tau + .5 * g * tau * tau;
      const rot = (rnd(i + 710) - .5) * 900 * tau;
      const sc = 1 - .25 * prog(tau, 0, .6);
      if (tau > .9) continue;
      const pts = s.poly.map(p => `${f2(p[0])},${f2(p[1])}`).join(' ');
      o += `<g transform="translate(${f2(s.mx + dx)},${f2(s.my + dy)}) rotate(${f2(rot)}) scale(${f2(sc)}) translate(${f2(-s.mx)},${f2(-s.my)})"><polygon points="${pts}" fill="${C.paper}" stroke="${C.ink}" stroke-width="10" stroke-linejoin="round"/></g>`;
    }
    // paper shreds
    for (let i = 0; i < 22; i++) {
      const a = rnd(i + 800) * 2 * Math.PI, v = 900 + 1400 * rnd(i + 820);
      const x = BB.cx + Math.cos(a) * v * tau, y = BB.cy + Math.sin(a) * v * tau - 500 * tau + 1600 * tau * tau;
      if (tau > .8) continue;
      const w = 20 + 30 * rnd(i + 840);
      o += `<g transform="translate(${f2(x)},${f2(y)}) rotate(${f2(rnd(i) * 360 + 800 * tau)})"><polygon points="${f2(-w / 2)},-8 ${f2(w / 2)},-14 ${f2(w / 3)},10 ${f2(-w / 2)},6" fill="${C.paper}" stroke="${C.ink}" stroke-width="4"/></g>`;
    }
    // letters scatter (on top of shards)
    for (const Lt of LETTERS) {
      const i = Lt.idx;
      let ddx = Lt.x - BB.cx, ddy = Lt.y - 60 - BB.cy; const dl = Math.hypot(ddx, ddy) + 1; ddx /= dl; ddy /= dl;
      const v = 1100 + 900 * rnd(i + 300), g = 3800;
      const x = Lt.x + ddx * v * tau, y = Lt.y + ddy * v * tau - 900 * tau * rnd(i + 330) + .5 * g * tau * tau;
      if (tau > .9) continue;
      const rot = (rnd(i + 360) - .5) * 1400 * tau, sc = 1 + .5 * eOutC(prog(tau, 0, .3));
      o += `<g transform="translate(${f2(x)},${f2(y - L.bb * .36)}) rotate(${f2(rot)}) scale(${f2(sc)})">${text(Lt.ch, 0, L.bb * .36, L.bb, C.ink, 'ID', 0)}</g>`;
    }
  }
  // the wheel bursts through
  if (drawWheel && t >= TB - .02) {
    const u = prog(t, TB - .02, TB + .3);
    const s = lerp(.15, 1, eOutBack(u, 2.2));
    const ang = 900 * eOutC(prog(t, TB - .02, TB + .7)) - 900;
    const bob = t > 1.1 ? Math.sin((t - 1.1) * 2 * Math.PI * 2) * 6 : 0;
    o += wheelC(CX, lerp(BB.cy, 640, eOutC(u)) + bob, 220, ang, s);
  }
  // rubber stamp «УЖЕ ДОСТАВЛЯЕМ»
  if (t >= TS - .1) o += stamp(t);
  o += '</g>';
  return o;
}
function stamp(t) {
  const u = prog(t, TS - .1, TS);
  const s = t < TS ? lerp(2.8, 1, eInQ(u)) : 1 + .05 * damped(t - TS, 5, 14) * -1;
  const op = clamp(u * 3);
  const cx = CX, cy = 1140, rot = -8 + (t < TS ? -6 * (1 - u) : 0);
  const sz = L.st, w = 760, h = sz * 2.2 + 80;
  let o = `<g opacity="${f2(op * .94)}" transform="translate(${cx},${cy}) rotate(${f2(rot)}) scale(${f2(s)})"><g mask="url(#stampMask)" fill="${C.ink}">`;
  o += `<rect x="${-w / 2}" y="${f2(-h / 2)}" width="${w}" height="${f2(h)}" rx="18" fill="none" stroke="${C.ink}" stroke-width="14"/>`;
  o += `<rect x="${-w / 2 + 22}" y="${f2(-h / 2 + 22)}" width="${w - 44}" height="${f2(h - 44)}" rx="8" fill="none" stroke="${C.ink}" stroke-width="5"/>`;
  o += text('УЖЕ', 0, -sz * .12, sz, C.ink, 'ID', .01);
  o += text('ДОСТАВЛЯЕМ', 0, sz * .98, sz, C.ink, 'ID', .01);
  o += '</g>';
  // ink splatter on impact
  if (t >= TS) {
    const v = eOutExpo(prog(t, TS, TS + .12));
    for (let i = 0; i < 12; i++) {
      const a = rnd(i + 1200) * 2 * Math.PI, d = (w / 2 + 20 + 60 * rnd(i + 1210)) * v;
      const x = Math.cos(a) * d, y = Math.sin(a) * d * .45, r = 3 + 9 * rnd(i + 1220);
      o += `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r * v)}" fill="${C.ink}"/>`;
    }
  }
  return o + '</g>';
}

// ======================= SCENE B: road (1.5 – 5.05) =======================
const GB = 1240, RB = 150, XB = 420;
function sceneB(t, drawWheel = true) {
  const v = 700;
  const s = v * Math.max(0, t - 1.5);
  let o = `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
  o += `<circle cx="${f2(820 - s * .02)}" cy="830" r="120" fill="${C.lime}"/>`;
  o += ridge(FAR, 1200, s * .12, GB, C.sand);
  o += ridge(MID, 1100, s * .3, GB, C.green);
  o += snow(MID, 1100, s * .3, C.paper);
  o += `<rect x="0" y="${GB}" width="${W}" height="240" fill="${C.ink}"/>`;
  o += `<rect x="0" y="${GB + 240}" width="${W}" height="${H - GB - 240}" fill="${C.sand}"/>`;
  const dash = 150, off = s % dash;
  for (let k = -1; k < 9; k++) o += `<rect x="${f2(k * dash - off)}" y="${GB + 113}" width="84" height="14" rx="7" fill="${C.paper}"/>`;
  // confetti cannons (behind text, over scenery)
  o += confetti(t, 2.0, 140, 1560, 18, 44, 1, 40, CONF, 4200);
  o += confetti(t, 2.0, 940, 1560, -18, 44, 2, 40, CONF, 4200);
  const ang = (s + XB) / RB * 180 / Math.PI;
  const bt = t - 2.0, ph = ((bt % .5) + .5) % .5 / .5, beatIdx = Math.floor(bt / .5);
  const sq = t >= 2.0 ? damped(((bt % .5) + .5) % .5, 4, 14) : 0;
  const wsy = 1 - .06 * sq, wsx = 1 + .04 * sq;
  o += speedLines(t, XB - RB + 20, GB - RB - 10, 300, C.ink, 1.7, 4.7, 31, 6, 240);
  if (drawWheel) o += wheel(XB, GB, RB, ang, wsx, wsy);
  // parcel A drops onto the wheel, lands on 2.0, then hops on every beat
  const topY = GB - 2 * RB * wsy + 6;
  let hopA = 0, rotA = 0;
  if (t >= 1.72) {
    if (t < 2.0) { hopA = lerp(topY + 160, 0, eInQ(prog(t, 1.72, 2.0))); hopA = (topY - (-220)) * (1 - eInQ(prog(t, 1.72, 2.0))); rotA = -25 * (1 - prog(t, 1.72, 2.0)); }
    else { hopA = 54 * Math.sin(Math.PI * ph); rotA = (beatIdx % 2 ? 1 : -1) * 7 * Math.sin(Math.PI * ph); }
    o += parcel(XB - 6, topY - hopA, rotA);
    // parcel C lands on top of A on 3.0
    if (t >= 2.72) {
      const baseC = topY - hopA - 146;
      let dropC = 0, rotC = 0;
      if (t < 3.0) { dropC = (baseC + 200) * (1 - eInQ(prog(t, 2.72, 3.0))); rotC = 30 * (1 - prog(t, 2.72, 3.0)); }
      else { const ph2 = (((t - 3.0) % .5) + .5) % .5 / .5; dropC = 16 * Math.sin(Math.PI * ph2); rotC = rotA * 1.6 + (beatIdx % 2 ? -1 : 1) * 4 * Math.sin(Math.PI * ph); }
      o += parcel(XB - 6 + rotA * 1.5, baseC - dropC, rotC, .74);
    }
  }
  // parcel B hops beside the wheel, lands on 2.5, then hops on every beat
  if (t >= 2.22) {
    const XP = 790;
    let hopB, rotB;
    if (t < 2.5) { hopB = (GB + 200) * (1 - eInQ(prog(t, 2.22, 2.5))); rotB = 20 * (1 - prog(t, 2.22, 2.5)); }
    else { const p3 = (((t - 2.5) % .5) + .5) % .5 / .5; hopB = 120 * Math.sin(Math.PI * p3); rotB = 360 * eInOutC(p3) * (Math.floor((t - 2.5) / .5) % 2 ? 0 : 1) * 0 + (Math.floor((t - 2.5) / .5) % 2 ? 8 : -8) * Math.sin(Math.PI * p3); }
    const sqB = t >= 2.5 ? damped(((t - 2.5) % .5), 5, 16) : 0;
    o += `<g transform="translate(${XP},${GB}) scale(${f2(1 + .08 * sqB)},${f2(1 - .1 * sqB)}) translate(${-XP},${-GB})">${parcel(XP, GB - hopB, rotB, .9)}</g>`;
  }
  // copy
  o += popText(t, 2.0, 'Kiwi Go', CX, 420, L.k1, C.ink, { out: [4.45, 4.6], rot: -6, ls: -0.04, from: 2.2 });
  o += popText(t, 2.25, 'запустился!', CX, 420 + L.k2 * 1.02, L.k2, C.ink, { out: [4.45, 4.6], rot: 5, from: 1.7 });
  // zoom into the hub 4.6 – 5.05
  const zu = prog(t, 4.6, 5.05);
  if (zu > 0) {
    const Z = Math.exp(Math.log(120) * Math.pow(zu, 2.1));
    const fx = XB, fy = GB - RB;
    const tx = lerp(fx, 540, eOutC(zu)), ty = lerp(fy, 960, eOutC(zu));
    o = `<rect width="${W}" height="${H}" fill="${C.ink}"/><g transform="translate(${f2(tx)},${f2(ty)}) scale(${Z.toFixed(4)}) translate(${-fx},${-fy})">${o}</g>`;
  }
  return o;
}

// ======================= SCENE C: messages (5.05 – 9.0) =======================
function bottomRoad(t, bg, roadCol, dashCol, ridgeCol, snowCol) {
  const G = 1462, R = 96, s = 760 * t;
  let o = ridge(MID, 1100, s * .3, G, ridgeCol, 300);
  if (snowCol) o += snow(MID, 1100, s * .3, snowCol, 300);
  o += `<rect x="0" y="${G}" width="${W}" height="${H - G}" fill="${roadCol}"/>`;
  const dash = 150, off = s % dash;
  for (let k = -1; k < 9; k++) o += `<rect x="${f2(k * dash - off)}" y="${G + 40}" width="84" height="12" rx="6" fill="${dashCol}"/>`;
  const bt = ((t - 5.0) % .5 + .5) % .5;
  const sq = damped(bt, 4, 14);
  o += wheel(530, G, R, s / R * 180 / Math.PI, 1 + .04 * sq, 1 - .06 * sq);
  return o;
}
function sceneC1(t) { // ink: «Доставка / по всему / Кыргызстану»
  let o = `<rect width="${W}" height="${H}" fill="${C.ink}"/>`;
  o += bottomRoad(t, C.ink, C.rim, C.ink, C.green, null);
  const sx = shake(t, 5.05, 12) + shake(t, 5.5, 16), sy = shake(t, 5.05, 9, 11) - shake(t, 5.5, 12, 11);
  const y1 = 700, sp = L.c * 1.12;
  o += seedBurst(t, 5.05, CX, y1 - L.c * .36, C.lime, 3, 12, 520);
  o += seedBurst(t, 5.5, CX, y1 + 2 * sp - L.c * .36, C.lime, 40, 14, 580);
  o += `<g transform="translate(${f2(sx)},${f2(sy)})">`;
  o += popText(t, 5.05, 'Доставка', CX, y1, L.c, C.paper, { from: 2.2, rot: -7, out: [6.72, 6.84] });
  o += popText(t, 5.25, 'по всему', CX, y1 + sp, L.c, C.paper, { from: 2.2, rot: 6, out: [6.72, 6.84] });
  o += popText(t, 5.5, 'Кыргызстану', CX, y1 + 2 * sp, L.c, C.lime, { from: 2.4, rot: -5, dur: .28, out: [6.72, 6.84] });
  o += '</g>';
  return o;
}
function sceneC2(t) { // lime: «от 350 сом»
  let o = `<rect width="${W}" height="${H}" fill="${C.lime}"/>`;
  o += bottomRoad(t, C.lime, C.ink, C.lime, C.rim, null);
  o += confetti(t, 7.0, 140, 1560, 18, 44, 30, 30, [C.ink, C.paper, C.green, C.peel], 4200);
  o += confetti(t, 7.0, 940, 1560, -18, 44, 31, 30, [C.ink, C.paper, C.green, C.peel], 4200);
  const sx = shake(t, 7.0, 22) + shake(t, 7.3, 10), sy = shake(t, 7.0, 18, 11);
  o += `<g transform="translate(${f2(sx)},${f2(sy)})">`;
  const yo = 600, yp = yo + 30 + L.p * .74, ys = yp + 105;
  const out = [8.72, 8.86];
  o += popText(t, 7.0, 'от', CX, yo, L.ot, C.ink, { from: 2, rot: -8, out });
  o += popText(t, 7.0, '350', CX, yp, L.p, C.ink, { from: 2.6, rot: 6, dur: .26, ls: -0.045, out });
  // ink pill with lime «сом»
  if (t >= 7.3 && t < out[1]) {
    const u = prog(t, 7.3, 7.52), s = eOutBack(u, 2.6) * (1 - .15 * eInC(prog(t, out[0], out[1])));
    const op = 1 - eInQ(prog(t, out[0], out[1]));
    const pw = L.somW + 120, ph = L.som * 1.25;
    o += `<g opacity="${f2(op)}" transform="translate(${CX},${f2(ys + ph / 2)}) rotate(${f2(-4 + 10 * (1 - u))}) scale(${f2(s)}) translate(${-CX},${f2(-(ys + ph / 2))})">
      <rect x="${f2(CX - pw / 2)}" y="${ys}" width="${f2(pw)}" height="${f2(ph)}" rx="${f2(ph / 2)}" fill="${C.ink}"/>
      ${text('сом', CX, ys + ph / 2 + L.som * .36 - L.som * .1, L.som, C.lime, 'ID', -0.03)}</g>`;
  }
  o += '</g>';
  return o;
}

// ======================= SCENE D: end card (8.9 – 12) =======================
function sceneD(t) {
  const LY = 700, R = 210, G = LY + R;
  let o = `<circle cx="540" cy="900" r="${f2(1800 * eOutC(prog(t, 8.88, 9.15)))}" fill="${C.paper}"/>`;
  o += confettiRain(t, 9.4, 50, 46, [C.lime, C.rim, C.ink, C.peel, C.green]);
  const gl = eOutC(prog(t, 9.3, 9.6));
  o += `<rect x="${f2(530 - 300 * gl)}" y="${G + 4}" width="${f2(600 * gl)}" height="12" rx="6" fill="${C.ink}"/>`;
  // wheel spins in from nothing, stops on 9.5 (bell)
  const u = prog(t, 8.93, 9.5);
  if (t >= 8.93) {
    const s = eOutBack(u, 1.9);
    const ang = -720 * Math.pow(1 - eOutC(u), 1) + (t > 9.5 ? 6 * damped(t - 9.5, 2.2, 4) : 0);
    const land = t > 9.5 ? damped(t - 9.5, 3.5, 9) : 0;
    const idle = t > 10.4 ? 8 * Math.sin((t - 10.4) * Math.PI * 2) * Math.min(1, (t - 10.4) * 2) : 0; // gentle bob in time
    const hop = t > 10.4 ? Math.abs(Math.sin((t - 10.4) * Math.PI * 2)) * 18 * Math.min(1, (t - 10.4) * 2) : 0;
    o += `<g transform="translate(530,${G}) scale(${f2(1 + .06 * land)},${f2(1 - .08 * land)}) translate(0,${f2(-hop)}) translate(-530,${-G})">${wheelC(530, LY, R, ang + idle * .3, s)}</g>`;
  }
  o += seedBurst(t, 9.5, 530, LY, C.lime, 120, 12, 380, .9);
  const wy = 1110;
  o += popText(t, 9.6, 'Kiwi Go', CX, wy, L.wm, C.ink, { from: .4, rot: -4, dur: .3, ls: -0.04, back: 2.4 });
  if (t >= 9.95) {
    const pu = prog(t, 9.95, 10.2), s = eOutBack(pu, 2.4);
    const py = wy + 70, ph = 116;
    o += `<g transform="translate(${CX},${py + ph / 2}) scale(${f2(s)}) translate(${-CX},${-(py + ph / 2)})">
      <rect x="${f2(CX - L.pillW / 2)}" y="${py}" width="${f2(L.pillW)}" height="${ph}" rx="${ph / 2}" fill="${C.ink}"/>
      ${text('Заказать: kiwigo.kg', CX, py + ph / 2 + L.pill * .36, L.pill, C.lime, 'IX', -0.02)}</g>`;
  }
  return o;
}

// ======================= timeline =======================
function render(t) {
  let o = '';
  if (t < 1.5) o = sceneA(t);
  else if (t < 1.74) { // push transition A → B; the wheel travels between the two scenes
    const u = eInOutC(prog(t, 1.5, 1.74));
    o += `<g transform="translate(${f2(-1080 * u)},0)">${sceneA(t, false)}</g>`;
    o += `<g transform="translate(${f2(1080 * (1 - u))},0)">${sceneB(t, false)}</g>`;
    const x = lerp(CX, XB, u), cy = lerp(640, GB - RB, u), r = lerp(220, RB, u);
    o += wheelC(x, cy - 120 * Math.sin(Math.PI * u), r, 360 * u + 900 * 0, 1);
  }
  else if (t < 5.05) o = sceneB(t);
  else if (t < 7.0) {
    o = sceneC1(t);
    const iu = eInC(prog(t, 6.84, 7.0)); // lime iris
    if (iu > 0) o += `<circle cx="530" cy="900" r="${f2(1250 * iu)}" fill="${C.lime}"/>`;
  }
  else if (t < 9.15) { o = sceneC2(t); if (t >= 8.88) o += sceneD(t); }
  else o = `<rect width="${W}" height="${H}" fill="${C.paper}"/>` + sceneD(t);
  document.getElementById('root').innerHTML = o;
}

window.READY = false;
Promise.all([document.fonts.load('900 100px ID'), document.fonts.load('800 100px IX')])
  .then(() => document.fonts.ready)
  .then(() => { layout(); render(0); window.READY = true; });
</script>
