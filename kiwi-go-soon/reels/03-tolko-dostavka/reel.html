<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Kiwi Go Reel 03</title>
<style>
@font-face{font-family:'ID';src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf') format('opentype');font-weight:900}
@font-face{font-family:'IX';src:url('file:///home/user/kyz-uzatuu/kiwi-go-soon/fonts/Inter-ExtraBold.otf') format('opentype');font-weight:800}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111410}
svg{display:block}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs"></defs>
  <g id="root"></g>
  <g id="measure" opacity="0"></g>
</svg>
<script>
// Kiwi Go — Reel 03 «Платите только за доставку». Deterministic: render(t) draws the frame at time t (s).
const C = { lime:'#B8F03C', ink:'#111410', paper:'#FFFDF7', cream:'#F6F1E4', sand:'#ECE6D6',
            peel:'#7A5A3C', green:'#3F6212', rim:'#6BA82B' };
const W = 1080, H = 1920, CX = 530, DUR = 10.0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = u => 1 - Math.pow(1 - u, 3);
const eInC = u => u * u * u;
const eInQ = u => u * u;
const eInOutC = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOutBack = (u, s = 1.70158) => { const c = s + 1; return 1 + c * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const eOutExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const damped = (tau, f = 3, d = 7) => tau < 0 ? 0 : Math.exp(-d * tau) * Math.cos(2 * Math.PI * f * tau);
const shake = (t, t0, amp, f = 13) => t < t0 ? 0 : amp * Math.exp(-(t - t0) * 12) * Math.sin((t - t0) * f * 2 * Math.PI);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f2 = n => (+n).toFixed(2);

// ---------- logo (exact copy of logo/kiwi-go-logo.svg) ----------
(function defs() {
  let seeds = '';
  for (let i = 0; i < 12; i++) seeds += `<ellipse cx="0" cy="-56.3" rx="5" ry="14" transform="rotate(${i * 30})"/>`;
  document.getElementById('defs').innerHTML =
    `<g id="logo"><circle r="100" fill="${C.ink}"/><circle r="86" fill="${C.rim}"/><circle r="80.5" fill="${C.lime}"/>` +
    `<g fill="${C.ink}">${seeds}</g><circle r="26" fill="${C.cream}"/><circle r="8.5" fill="${C.ink}"/></g>`;
})();
function wheel(x, groundY, r, angDeg, sx = 1, sy = 1) {
  return `<g transform="translate(${f2(x)},${f2(groundY)}) scale(${f2(sx)},${f2(sy)}) translate(0,${f2(-r)}) rotate(${f2(angDeg)}) scale(${r / 100})"><use href="#logo"/></g>`;
}

// ---------- text ----------
function measure(str, font, size, ls) {
  const m = document.getElementById('measure');
  m.innerHTML = `<text font-family="${font}" font-size="${size}" style="letter-spacing:${ls * size}px">${str}</text>`;
  return m.firstChild.getComputedTextLength();
}
function fit(strs, font, maxW, cap, ls = -0.035) {
  let s = cap;
  for (const str of strs) s = Math.min(s, cap * maxW / measure(str, font, cap, ls));
  return Math.floor(s);
}
function text(str, x, y, size, fill, font = 'ID', ls = -0.035, anchor = 'middle') {
  return `<text x="${f2(x)}" y="${f2(y)}" font-family="${font}" font-size="${f2(size)}" fill="${fill}" text-anchor="${anchor}" style="letter-spacing:${f2(ls * size)}px">${str}</text>`;
}
function popText(t, t0, str, x, y, size, fill, opts = {}) {
  if (t < t0) return '';
  const { font = 'ID', dur = .24, from = 1.6, rot = 0, out = null, ls = -0.035, back = 2.2 } = opts;
  const u = prog(t, t0, t0 + dur);
  let s = lerp(from, 1, eOutBack(u, back));
  let op = clamp((t - t0) / 0.05);
  let dy = 0;
  if (out) { const v = prog(t, out[0], out[1]); if (v >= 1) return ''; op *= 1 - eInQ(v); dy = -60 * eInC(v); s *= 1 - .15 * eInC(v); }
  const cy = y - size * 0.36;
  return `<g opacity="${f2(op)}" transform="translate(${f2(x)},${f2(cy + dy)}) rotate(${f2(rot * (1 - eOutC(u)))}) scale(${s.toFixed(4)}) translate(${f2(-x)},${f2(-cy)})">${text(str, x, y, size, fill, font, ls)}</g>`;
}
// pill with text, popping in (scale about centre)
function pill(t, t0, str, cx, top, size, bg, fg, padX, opts = {}) {
  if (t < t0) return '';
  const { font = 'ID', ls = -0.035, rot = 0, out = null, hk = 1.18 } = opts;
  const u = prog(t, t0, t0 + .26);
  let s = eOutBack(u, 2.4), op = 1, dy = 0;
  if (out) { const v = prog(t, out[0], out[1]); if (v >= 1) return ''; op = 1 - eInQ(v); dy = -60 * eInC(v); s *= 1 - .15 * eInC(v); }
  const w = measure(str, font, size, ls) + 2 * padX, h = size * hk, cy = top + h / 2;
  return `<g opacity="${f2(op)}" transform="translate(${f2(cx)},${f2(cy + dy)}) rotate(${f2(rot + 6 * (1 - u))}) scale(${f2(s)}) translate(${f2(-cx)},${f2(-cy)})">
    <rect x="${f2(cx - w / 2)}" y="${f2(top)}" width="${f2(w)}" height="${f2(h)}" rx="${f2(h / 2)}" fill="${bg}"/>
    ${text(str, cx, cy + size * .36, size, fg, font, ls)}</g>`;
}
function burst(t, t0, x, y, color, seed, n = 12, dist = 520, life = .55) {
  const u = prog(t, t0, t0 + life);
  if (t < t0 || u >= 1) return '';
  let out = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * 360 + rnd(seed + i) * 18;
    const d = 120 + dist * eOutExpo(u) * (0.7 + .3 * rnd(seed + i + 9));
    const sc = 1 - eInQ(u);
    out += `<g transform="rotate(${f2(ang)} ${x} ${y}) translate(${x} ${f2(y - d)}) scale(${f2(sc)})"><ellipse rx="11" ry="24" fill="${color}"/></g>`;
  }
  return out;
}
function speedLines(t, x, cy, spread, color, t0, t1, seed, n = 6, maxLen = 260, dir = 1) {
  let out = '';
  const a = prog(t, t0, t0 + .12) * (1 - prog(t, t1 - .12, t1));
  if (a <= 0) return '';
  for (let i = 0; i < n; i++) {
    const r1 = rnd(seed + i), r2 = rnd(seed + i + 50);
    const y = cy + (r1 - .5) * spread;
    const len = maxLen * (0.45 + .55 * r2) * a;
    const phase = ((t * 3.2 + r2) % 1);
    const xx = dir > 0 ? x - 30 - phase * 120 - len : x + 30 + phase * 120;
    const hgt = i % 3 === 0 ? 16 : 9;
    out += `<rect x="${f2(xx)}" y="${f2(y - hgt / 2)}" width="${f2(len)}" height="${hgt}" rx="${hgt / 2}" fill="${color}" opacity="${f2(a)}"/>`;
  }
  return out;
}

let L = {};
function layout() {
  L.tagName = 64;
  L.tagPrice = fit(['2 400 сом'], 'ID', 450, 112, -0.03);
  L.q = fit(['А сколько', 'возьмут', 'за доставку?'], 'ID', 820, 128);
  L.pct = 330;
  L.ot = fit(['от стоимости', 'товара'], 'ID', 840, 140);
  L.zero = fit(['0%'], 'ID', 760, 600, -0.05);
  L.otT = fit(['от товара'], 'ID', 760, 140);
  L.pay = fit(['Платите', 'только за'], 'ID', 840, 150);
  L.payPill = fit(['доставку'], 'ID', 700, 150);
  L.price = fit(['от 350 сом'], 'ID', 680, 140);
  L.site = fit(['kiwigo.kg'], 'IX', 640, 104, -0.02);
}

// ---------- scene A (0 – 2.05): lime. Swinging price tag on a dress + question ----------
function dress() { // hanger hook at (0,0); dress hangs below
  const ink = C.ink;
  return `<path d="M 0 66 L 0 34 C 0 18 26 14 26 -6 C 26 -28 -2 -36 -16 -24" stroke="${ink}" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M -86 248 L -60 120 C -40 150 40 150 60 120 L 86 248 L 74 300 C 160 420 210 560 236 640
    C 200 668 160 640 120 668 C 80 696 40 664 0 690 C -40 664 -80 696 -120 668 C -160 640 -200 668 -236 640
    C -210 560 -160 420 -74 300 Z" fill="${C.paper}" stroke="${ink}" stroke-width="10" stroke-linejoin="round"/>
  <path d="M -60 120 L -56 96 M 60 120 L 56 96" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>
  <rect x="-80" y="282" width="160" height="30" rx="10" fill="${ink}"/>
  <circle cx="0" cy="297" r="9" fill="${C.lime}"/>
  <path d="M -40 380 L -96 600 M 40 380 L 96 600 M 0 390 L 0 640" stroke="${C.sand}" stroke-width="10" stroke-linecap="round"/>
  <path d="M -170 92 L 0 66 L 170 92 L 170 106 L -170 106 Z" fill="${C.peel}" stroke="${ink}" stroke-width="9" stroke-linejoin="round"/>`;
}
function tag(t) { // pivot (string knot) at (0,0); tag hangs below
  const w = 520, h = 330, o = 110;
  const nameY = o + 128, priceY = o + 172 + L.tagPrice * .74;
  let sp = '';
  if (t > .3 && t < .95) { // ka-ching sparkles
    const u = prog(t, .3, .95);
    for (let i = 0; i < 7; i++) {
      const a = (-90 + (i - 3) * 34) * Math.PI / 180, d = 200 + 170 * eOutExpo(u);
      const px = Math.cos(a) * d * 1.25, py = o + 200 + Math.sin(a) * d, s = (1 - u) * 26;
      sp += `<path d="M ${f2(px)} ${f2(py - s)} L ${f2(px + s * .3)} ${f2(py)} L ${f2(px)} ${f2(py + s)} L ${f2(px - s * .3)} ${f2(py)} Z M ${f2(px - s)} ${f2(py)} L ${f2(px)} ${f2(py + s * .3)} L ${f2(px + s)} ${f2(py)} L ${f2(px)} ${f2(py - s * .3)} Z" fill="${C.ink}"/>`;
    }
  }
  return `${sp}<path d="M 0 0 L 0 ${o + 22}" stroke="${C.ink}" stroke-width="6"/>
  <path d="M -64 ${o - 4} L 64 ${o - 4} L ${w / 2} ${o + 58} L ${w / 2} ${o + h} L ${-w / 2} ${o + h} L ${-w / 2} ${o + 58} Z"
    fill="${C.paper}" stroke="${C.ink}" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="0" cy="${o + 26}" r="13" fill="${C.lime}" stroke="${C.ink}" stroke-width="8"/>
  ${text('Платье', 0, nameY, L.tagName, C.ink, 'IX', -0.02)}
  <rect x="${-w / 2 + 40}" y="${nameY + 26}" width="${w - 80}" height="6" rx="3" fill="${C.sand}"/>
  ${text('2 400 сом', 0, priceY, L.tagPrice, C.ink, 'ID', -0.03)}`;
}
function sceneA(t) {
  let o = `<rect width="${W}" height="${H}" fill="${C.lime}"/>`;
  // rail
  o += `<rect x="-20" y="236" width="1120" height="16" rx="8" fill="${C.ink}"/>`;
  // drop in on the hanger: 0 – 0.30, then sway
  const HX = 360, HY = 252;
  const dropU = prog(t, 0, .3);
  const dy = -900 * (1 - eInQ(dropU));
  const sway = t < .3 ? -10 * (1 - dropU) : 7 * damped(t - .3, 1.1, 1.6);
  const tagRot = t < .3 ? 30 * (1 - dropU) - 8 : -8 + 26 * damped(t - .3, 1.35, 1.25) - 6 * damped(t - .9, 1.35, 2) ;
  const kick = t > .3 ? shake(t, .3, 10) : 0;
  o += `<g transform="translate(${HX},${f2(HY + dy + kick)}) rotate(${f2(sway)}) scale(1.1)">${dress()}
    <g transform="translate(165,100) rotate(${f2(tagRot)})">${tag(t)}</g></g>`;
  // question
  const y0 = 1150, ls = L.q * 1.04;
  o += popText(t, .85, 'А сколько', CX, y0, L.q, C.ink, { rot: -5 });
  o += popText(t, 1.0, 'возьмут', CX, y0 + ls, L.q, C.ink, { rot: 4 });
  o += pill(t, 1.18, 'за доставку?', CX, y0 + ls + 40, L.q * .85, C.ink, C.lime, 50, { rot: -2 + 3 * Math.sin((t - 1.18) * 5) * prog(t, 1.4, 1.6) });
  return o;
}

// ---------- scene B (2.0 – 4.95): paper. «% от стоимости товара» → strike → wheel flattens it ----------
function sceneB(t) {
  let o = `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
  const G = 1190;          // floor under the text block
  const tSmash = 4.0;      // wheel lands on the text
  const sq = t < tSmash ? 1 : lerp(1, .085, eOutExpo(prog(t, tSmash, tSmash + .08)));
  const wob = t >= tSmash ? 1 + .06 * damped(t - tSmash, 5, 9) : 1;
  const sx = t < tSmash ? 1 : 1 + .16 * eOutC(prog(t, tSmash, tSmash + .1)) * wob;
  const sh = shake(t, tSmash, 18);
  let blk = '';
  blk += pill(t, 2.1, '%', CX, 420, L.pct, C.ink, C.lime, 80, { hk: 1.02, rot: -4 });
  blk += popText(t, 2.4, 'от стоимости', CX, 960, L.ot, C.ink, { rot: -4 });
  blk += popText(t, 2.6, 'товара', CX, 960 + L.ot * 1.05, L.ot, C.ink, { rot: 4 });
  // strikes (marker: ink outline + lime core)
  const strike = (d, a, b, w) => {
    const u = eOutC(prog(t, a, b));
    if (u <= 0) return '';
    return `<path d="${d}" pathLength="1" stroke="${C.ink}" stroke-width="${w + 22}" stroke-linecap="round" fill="none" stroke-dasharray="${f2(u)} 2"/>
            <path d="${d}" pathLength="1" stroke="${C.lime}" stroke-width="${w}" stroke-linecap="round" fill="none" stroke-dasharray="${f2(u)} 2"/>`;
  };
  blk += strike('M 150 1130 C 400 980 650 760 920 470', 3.05, 3.3, 56);
  blk += strike('M 170 560 C 420 700 700 900 910 1120', 3.42, 3.65, 56);
  o += `<g transform="translate(${f2(sh)},0) translate(${CX},${G}) scale(${f2(sx)},${f2(sq)}) translate(${-CX},${-G})">${blk}</g>`;
  if (t >= tSmash) { // floor crack line + dust
    o += `<rect x="${f2(CX - 470 * eOutExpo(prog(t, tSmash, tSmash + .2)))}" y="${G}" width="${f2(940 * eOutExpo(prog(t, tSmash, tSmash + .2)))}" height="14" rx="7" fill="${C.ink}"/>`;
    for (let i = 0; i < 10; i++) {
      const age = t - tSmash, life = .5;
      if (age > life) break;
      const a = age / life, dir = i % 2 ? 1 : -1;
      const px = CX + dir * (240 + 380 * eOutC(a) * (0.6 + .4 * rnd(i)));
      const py = G - 14 - 140 * Math.sin(Math.PI * a) * rnd(i + 7);
      o += `<circle cx="${f2(px)}" cy="${f2(py)}" r="${f2(20 * (1 - a) + 6)}" fill="${C.ink}" opacity="${f2(1 - a)}"/>`;
    }
  }
  // wheel: falls 3.78 – 4.0, squash, then rolls off right 4.3 – 4.75
  const R = 250;
  if (t >= 3.78) {
    let x = CX, gy, wsx = 1, wsy = 1, ang = 0;
    if (t < tSmash) { const u = prog(t, 3.78, tSmash); gy = lerp(-120, G - 2 * 0, eInQ(u)); wsy = 1 + .12 * u; wsx = 1 - .08 * u; ang = 20 * (1 - u); }
    else {
      gy = G - 10; const s = damped(t - tSmash, 3.4, 8); wsy = 1 - .22 * s; wsx = 1 + .18 * s;
      const ru = prog(t, 4.3, 4.78);
      x = CX + 1000 * eInC(ru); ang = (x - CX) / R * 180 / Math.PI;
      if (t > 4.15 && t < 4.3) ang = -8 * Math.sin(Math.PI * prog(t, 4.15, 4.3));
    }
    o += speedLines(t, x - R + 10, G - R, 320, C.ink, 4.36, 4.8, 21, 6, 280);
    o += wheel(x, gy, R, ang, wsx, wsy);
  }
  return o;
}

// ---------- scene C (4.95 – 8.0): ink. «0%» «от товара» → «Платите только за доставку» ----------
function sceneC(t) {
  let o = `<rect width="${W}" height="${H}" fill="${C.ink}"/>`;
  const sx = shake(t, 5.0, 20) + shake(t, 6.5, 8), sy = shake(t, 5.0, 14, 11);
  const zy = 900;
  o += burst(t, 5.0, CX, zy - L.zero * .36, C.lime, 3, 14, 620);
  o += `<g transform="translate(${f2(sx)},${f2(sy)})">`;
  const drift = 1 + .03 * prog(t, 5.3, 6.4);
  o += `<g transform="translate(${CX},${zy - L.zero * .36}) scale(${drift.toFixed(4)}) translate(${-CX},${-(zy - L.zero * .36)})">`;
  o += popText(t, 5.0, '0%', CX, zy, L.zero, C.lime, { from: 2.6, rot: -10, dur: .28, ls: -0.05, out: [6.3, 6.42] });
  o += '</g>';
  o += popText(t, 5.5, 'от товара', CX, zy + 290, L.otT, C.paper, { rot: 4, out: [6.3, 6.42] });
  const py = 620, pl = L.pay * 1.06;
  o += popText(t, 6.5, 'Платите', CX, py, L.pay, C.paper, { rot: -5 });
  o += popText(t, 6.75, 'только за', CX, py + pl, L.pay, C.paper, { rot: 4 });
  o += pill(t, 7.0, 'доставку', CX, py + pl + 60, L.payPill, C.lime, C.ink, 60, { rot: -3 });
  o += '</g>';
  o += burst(t, 7.0, CX, py + pl + 60 + L.payPill * .59, C.lime, 40, 12, 520, .5);
  return o;
}

// ---------- scene D (7.9 – 10): paper end card ----------
function sceneD(t) {
  let o = '';
  const LY = 620, R = 200, G = LY + R;
  const ir = 1900 * eOutC(prog(t, 7.9, 8.2));
  o += `<circle cx="540" cy="${LY}" r="${f2(ir)}" fill="${C.paper}"/>`;
  const gl = eOutC(prog(t, 7.95, 8.3));
  o += `<rect x="230" y="${G + 2}" width="${f2(620 * gl)}" height="12" rx="6" fill="${C.ink}"/>`;
  const u = prog(t, 7.98, 8.5);
  const x = lerp(-320, CX, eOutBack(u, 1.6));
  const sq = t > 8.5 ? damped(t - 8.5, 3.5, 9) : 0;
  const ang = (x - CX) / R * 180 / Math.PI;
  o += speedLines(t, x - R + 20, LY, 300, C.ink, 7.98, 8.5, 71, 6, 260);
  if (u > 0) o += wheel(x, G, R, ang, 1 + .05 * sq, 1 - .07 * sq);
  o += pill(t, 8.55, 'от 350 сом', CX, 960, L.price, C.ink, C.lime, 70, { rot: -2 });
  const su = eOutC(prog(t, 8.85, 9.15));
  if (t >= 8.85) o += `<g opacity="${f2(clamp((t - 8.85) / .12))}" transform="translate(0,${f2(40 * (1 - su))})">${text('kiwigo.kg', CX, 1340, L.site, C.ink, 'IX', -0.02)}</g>`;
  return o;
}

function render(t) {
  let o = '';
  if (t < 2.12) {
    const u = eInOutC(prog(t, 1.95, 2.12));
    o += `<g transform="translate(0,${f2(-1920 * u)})">${sceneA(t)}</g>`;
    if (u > 0) o += `<g transform="translate(0,${f2(1920 * (1 - u))})">${sceneB(t)}</g>`;
  } else if (t < 4.86) o += sceneB(t);
  else if (t < 7.9) {
    o += sceneC(t);
    if (t < 5.0) { // ink iris wipes in from the hub as wheel leaves
      const r = 2000 * eInC(prog(t, 4.86, 5.0));
      o = `${sceneB(t)}<clipPath id="ci"><circle cx="${CX}" cy="900" r="${f2(r)}"/></clipPath><g clip-path="url(#ci)">${o}</g>`;
    }
  } else {
    o += t < 8.2 ? sceneC(t) : '';
    o += sceneD(t);
  }
  document.getElementById('root').innerHTML = o;
}

window.READY = false;
Promise.all([document.fonts.load('900 100px ID'), document.fonts.load('800 100px IX')])
  .then(() => document.fonts.ready)
  .then(() => { layout(); render(0); window.READY = true; });
</script>
</body></html>
